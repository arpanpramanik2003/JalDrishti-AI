name: jaldrishti_mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & HTTP
  provider: ^6.1.1
  http: ^1.2.0
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.1.2

  # Location & Maps
  geolocator: ^10.1.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # UI Components & Icons
  google_fonts: ^6.1.0
  lucide_icons: ^0.257.0
  intl: ^0.20.2
  flutter_markdown: ^0.7.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
